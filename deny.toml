# cargo-deny: licences, advisories, duplicate and banned crates.   cargo deny check
[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Only licences the dependency tree actually uses. When `cargo deny check` rejects a new
# dependency, review its licence and add it here on purpose.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Reject `*` version requirements on registry dependencies. Workspace path dependencies
# (our own crates) have no version and are allowed because the crates are `publish = false`.
wildcards = "deny"
allow-wildcard-paths = true
# Two major versions of `syn` exist in the ecosystem right now (clap and thiserror use 3,
# tracing-attributes uses 2). Nothing we can do until tracing moves to 3; remove then.
skip = [{ crate = "syn@2", reason = "tracing-attributes has not moved to syn 3 yet" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
